<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — TAUTRAILS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="auth-body">

<div class="auth-page">
  <div class="auth-bg"></div>
  <div class="auth-card">
    <a href="/" class="auth-logo">
      <img src="/assets/logo.png" alt="TauTrails">
    </a>
    <h2 class="auth-title">Добро пожаловать</h2>
    <p class="auth-subtitle">Войдите, чтобы оставлять отзывы и следить за маршрутами</p>

    <div id="authAlert" class="alert" role="alert" aria-live="polite"></div>

    <div class="form-group">
      <label for="loginUsername">Логин или Email</label>
      <input type="text" id="loginUsername" placeholder="Ваш логин"
             autocomplete="username" autofocus>
    </div>
    <div class="form-group">
      <label for="loginPassword">Пароль</label>
      <div class="input-password-wrap">
        <input type="password" id="loginPassword" placeholder="••••••••"
               autocomplete="current-password">
        <button type="button" class="input-password-toggle" aria-label="Показать пароль"
                onclick="togglePassword('loginPassword', this)">👁</button>
      </div>
    </div>

    <button class="btn btn--primary btn--full" id="loginBtn">Войти</button>

    <div class="auth-divider"><span>или</span></div>

    <a href="/register" class="btn btn--secondary btn--full">Создать аккаунт</a>

    <p class="auth-back"><a href="/">← Вернуться на главную</a></p>
  </div>
</div>

<script>
  // Если уже авторизован — редирект
  fetch('/api/auth/me').then(r => { if (r.ok) window.location.href = '/'; });

  function togglePassword(id, btn) {
    const inp = document.getElementById(id);
    if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
    else { inp.type = 'password'; btn.textContent = '👁'; }
  }

  function showAlert(msg, type = 'error') {
    const el = document.getElementById('authAlert');
    el.className = `alert alert--${type} show`;
    el.textContent = msg;
  }

  async function doLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!username || !password) return showAlert('Заполните все поля');

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Вход...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (res.ok) {
        const redirect = new URLSearchParams(location.search).get('redirect') || '/';
        window.location.href = data.role === 'admin' ? '/admin' : redirect;
      } else {
        showAlert(data.error || 'Ошибка входа');
      }
    } catch {
      showAlert('Ошибка соединения с сервером');
    }

    btn.disabled = false;
    btn.textContent = 'Войти';
  }

  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('loginPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('loginUsername').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('loginPassword').focus();
  });
</script>
</body>
</html>
