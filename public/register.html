<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — TAUTRAILS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .password-strength { margin-top: 6px; height: 4px; border-radius: 2px; background: var(--color-border, #ddd); overflow: hidden; }
    .password-strength__bar { height: 100%; width: 0; border-radius: 2px; transition: width .3s, background .3s; }
    .password-hint { font-size: 11px; margin-top: 4px; }
  </style>
</head>
<body class="auth-body">

<div class="auth-page">
  <div class="auth-bg"></div>
  <div class="auth-card">
    <a href="/" class="auth-logo">
      <img src="/assets/logo.png" alt="TauTrails">
    </a>
    <h2 class="auth-title">Создать аккаунт</h2>
    <p class="auth-subtitle">Присоединяйтесь к сообществу любителей гор</p>

    <div id="authAlert" class="alert" role="alert" aria-live="polite"></div>

    <div class="form-group">
      <label for="regUsername">Имя пользователя *</label>
      <input type="text" id="regUsername" placeholder="mountainhiker"
             autocomplete="username" autofocus minlength="3">
    </div>
    <div class="form-group">
      <label for="regEmail">Email</label>
      <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="regPassword">Пароль *</label>
      <div class="input-password-wrap">
        <input type="password" id="regPassword" placeholder="Минимум 6 символов"
               autocomplete="new-password" minlength="6">
        <button type="button" class="input-password-toggle" aria-label="Показать пароль"
                onclick="togglePassword('regPassword', this)">👁</button>
      </div>
      <div class="password-strength"><div class="password-strength__bar" id="strengthBar"></div></div>
      <p class="password-hint" id="strengthHint"></p>
    </div>
    <div class="form-group">
      <label for="regConfirm">Подтвердите пароль *</label>
      <div class="input-password-wrap">
        <input type="password" id="regConfirm" placeholder="••••••••" autocomplete="new-password">
        <button type="button" class="input-password-toggle" aria-label="Показать пароль"
                onclick="togglePassword('regConfirm', this)">👁</button>
      </div>
    </div>

    <button class="btn btn--primary btn--full" id="registerBtn">Зарегистрироваться</button>

    <div class="auth-divider"><span>уже есть аккаунт?</span></div>
    <a href="/login" class="btn btn--secondary btn--full">Войти</a>
    <p class="auth-back"><a href="/">← Вернуться на главную</a></p>
  </div>
</div>

<script>
  fetch('/api/auth/me').then(r => { if (r.ok) window.location.href = '/'; });

  function togglePassword(id, btn) {
    const inp = document.getElementById(id);
    if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
    else { inp.type = 'password'; btn.textContent = '👁'; }
  }

  function showAlert(msg, type = 'error') {
    const el = document.getElementById('authAlert');
    el.className = `alert alert--${type} show`;
    el.textContent = msg;
  }

  // ── Password strength meter ───────────────────────────────────────────────
  document.getElementById('regPassword').addEventListener('input', function() {
    const val = this.value;
    const bar  = document.getElementById('strengthBar');
    const hint = document.getElementById('strengthHint');
    let score = 0;
    if (val.length >= 6)  score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const levels = [
      { w: '20%', c: '#ef4444', t: 'Очень слабый' },
      { w: '40%', c: '#f97316', t: 'Слабый' },
      { w: '60%', c: '#eab308', t: 'Средний' },
      { w: '80%', c: '#22c55e', t: 'Хороший' },
      { w: '100%',c: '#16a34a', t: 'Надёжный' },
    ];
    const lvl = levels[Math.min(score - 1, 4)] || { w: '0', c: 'transparent', t: '' };
    bar.style.width = val ? lvl.w : '0';
    bar.style.background = lvl.c;
    hint.textContent = val ? lvl.t : '';
    hint.style.color = lvl.c;
  });

  async function doRegister() {
    const username        = document.getElementById('regUsername').value.trim();
    const email           = document.getElementById('regEmail').value.trim();
    const password        = document.getElementById('regPassword').value;
    const confirmPassword = document.getElementById('regConfirm').value;

    if (!username || !password || !confirmPassword) return showAlert('Заполните обязательные поля');
    if (password !== confirmPassword) return showAlert('Пароли не совпадают');
    if (password.length < 6) return showAlert('Пароль минимум 6 символов');

    const btn = document.getElementById('registerBtn');
    btn.disabled = true;
    btn.textContent = 'Регистрация...';

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username, email, password, confirmPassword })
      });
      const data = await res.json();

      if (res.ok) {
        window.location.href = '/';
      } else {
        showAlert(data.error || 'Ошибка регистрации');
      }
    } catch {
      showAlert('Ошибка соединения с сервером');
    }

    btn.disabled = false;
    btn.textContent = 'Зарегистрироваться';
  }

  document.getElementById('registerBtn').addEventListener('click', doRegister);
  document.getElementById('regConfirm').addEventListener('keydown', e => {
    if (e.key === 'Enter') doRegister();
  });
</script>
</body>
</html>
